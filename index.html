<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Простір Розвитку</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(20, 184, 166, 0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.08), transparent 30%),
        #fafaf9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      line-height: 1;
    }
    .material-symbols-rounded.filled {
      font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    .fade-in { animation: fadeIn 0.35s ease-in-out; }
    .slide-in { animation: slideIn 0.28s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    input, button, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .safe-bottom { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="text-stone-800 selection:bg-teal-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const TELEGRAM_SEPARATOR = "\n\n";

    const Icon = ({ name, filled = false, size = 24, className = "" }) => (
      <span
        className={`material-symbols-rounded ${filled ? "filled" : ""} ${className}`}
        style={{ fontSize: size, display: "inline-flex", alignItems: "center", justifyContent: "center", width: size, height: size }}
      >
        {name}
      </span>
    );

    const uid = () => `${Date.now()}-${Math.random().toString(16).slice(2)}`;

    const formatTime = (totalSeconds) => {
      const safeSeconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
      const m = Math.floor(safeSeconds / 60);
      const s = safeSeconds % 60;
      return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
    };

    const sortDoneFirst = (taskList) => [
      ...taskList.filter(task => task.done),
      ...taskList.filter(task => !task.done)
    ];

    const buildTelegramTextFromTasks = (tasks) => tasks
      .map((task, index) => `${task.done ? "✅ " : ""}${index + 1}. ${(task.text || "").trim() || "..."}`)
      .join(TELEGRAM_SEPARATOR);

    const runTests = () => {
      console.assert(formatTime(-1) === "00:00", "formatTime should never show negative time");
      console.assert(formatTime(61) === "01:01", "formatTime should format minutes and seconds");

      const sampleTasks = [
        { text: "DiNails | Website", done: true },
        { text: "Beauty Med", done: true },
        { text: "English", done: false }
      ];
      const expectedTelegram = "✅ 1. DiNails | Website\n\n✅ 2. Beauty Med\n\n3. English";
      console.assert(buildTelegramTextFromTasks(sampleTasks) === expectedTelegram, "Telegram copy format is wrong");

      const sorted = sortDoneFirst([
        { text: "A", done: false },
        { text: "B", done: true },
        { text: "C", done: false }
      ]);
      console.assert(sorted[0].text === "B", "Done task should move to top");
    };
    runTests();

    const playSoftChime = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 0.08);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.7);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 2);
      } catch (e) {}
    };

    const calculateTaskTimes = (tasks, totalMinutes, mode) => {
      const normalizedTasks = tasks.filter(t => (t.title || "").trim());
      if (normalizedTasks.length === 0) return [];
      const safeMinutes = Math.max(1, Number(totalMinutes) || 1);
      const totalSeconds = safeMinutes * 60;

      if (mode === "even") {
        const base = Math.floor(totalSeconds / normalizedTasks.length);
        let remainder = totalSeconds - base * normalizedTasks.length;
        return normalizedTasks.map(t => {
          const extra = remainder > 0 ? 1 : 0;
          remainder -= extra;
          return { ...t, assignedSeconds: base + extra };
        });
      }

      const weightMap = { low: 1, medium: 2, high: 3 };
      const totalWeight = normalizedTasks.reduce((sum, t) => sum + (weightMap[t.priority] || 2), 0);
      let usedSeconds = 0;

      return normalizedTasks.map((t, index) => {
        const isLast = index === normalizedTasks.length - 1;
        const seconds = isLast
          ? totalSeconds - usedSeconds
          : Math.floor(totalSeconds * ((weightMap[t.priority] || 2) / totalWeight));
        usedSeconds += seconds;
        return { ...t, assignedSeconds: Math.max(1, seconds) };
      });
    };

    const getInitialDailyTasks = () => Array.from({ length: 10 }, () => ({ id: uid(), text: "", done: false }));

    function useStoredState(key, initialValue) {
      const [value, setValue] = useState(() => {
        try {
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : initialValue;
        } catch {
          return initialValue;
        }
      });

      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }, [key, value]);

      return [value, setValue];
    }

    function App() {
      const [section, setSection] = useState("plan");
      const [focusView, setFocusView] = useState("dashboard");
      const [history, setHistory] = useStoredState("focusHistoryV2", []);
      const [soundEnabled, setSoundEnabled] = useStoredState("soundEnabledV1", true);
      const [blockConfig, setBlockConfig] = useStoredState("focusBlockDraftV2", {
        title: "Фокус-блок",
        workDuration: 60,
        breakDuration: 10,
        distributionMode: "even",
        tasks: []
      });
      const [activeSession, setActiveSession] = useState(null);

      const openFocusCreate = () => {
        setSection("focus");
        setFocusView("create");
      };

      const renderFocusView = () => {
        switch (focusView) {
          case "dashboard":
            return <DashboardView goToCreate={() => setFocusView("create")} goToHistory={() => setFocusView("history")} history={history} />;
          case "create":
            return <CreateBlockView
              config={blockConfig}
              setConfig={setBlockConfig}
              goBack={() => setFocusView("dashboard")}
              startBlock={(sessionData) => {
                setActiveSession(sessionData);
                setFocusView("active");
                if (soundEnabled) playSoftChime();
              }}
            />;
          case "active":
            return <ActiveBlockView
              session={activeSession}
              updateSession={setActiveSession}
              soundEnabled={soundEnabled}
              finishBlock={(result) => {
                setHistory([{ ...result, date: new Date().toISOString() }, ...history]);
                setActiveSession(null);
                setFocusView("summary");
              }}
              abortBlock={() => {
                setActiveSession(null);
                setFocusView("dashboard");
              }}
            />;
          case "summary":
            return <SummaryView session={history[0]} startBreak={() => setFocusView("break")} goHome={() => setFocusView("dashboard")} />;
          case "break":
            return <BreakView duration={history[0]?.breakDuration || 10} finishBreak={() => setFocusView("dashboard")} soundEnabled={soundEnabled} />;
          case "history":
            return <HistoryView history={history} goBack={() => setFocusView("dashboard")} />;
          default:
            return <DashboardView goToCreate={() => setFocusView("create")} goToHistory={() => setFocusView("history")} history={history} />;
        }
      };

      const isFullTimer = section === "focus" && (focusView === "active" || focusView === "break");

      return (
        <div className="min-h-screen text-stone-800 font-sans selection:bg-teal-100">
          {!isFullTimer && (
            <nav className="max-w-5xl mx-auto px-4 sm:px-6 pt-4 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
              <div className="flex items-center justify-between gap-3">
                <div
                  className="text-xl font-medium tracking-tight flex items-center gap-2 cursor-pointer text-stone-700"
                  onClick={() => { setSection("plan"); setFocusView("dashboard"); }}
                >
                  <div className="w-6 h-6 rounded-full bg-teal-600 flex items-center justify-center shrink-0">
                    <div className="w-2 h-2 bg-white rounded-full"></div>
                  </div>
                  Простір
                </div>
                <div className="flex gap-2 sm:hidden">
                  <TopIconButton onClick={() => setSoundEnabled(!soundEnabled)} icon={soundEnabled ? "volume_up" : "volume_off"} />
                  <TopIconButton onClick={() => { setSection("focus"); setFocusView("history"); }} icon="history" />
                </div>
              </div>

              <div className="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0">
                <TabButton active={section === "plan"} onClick={() => setSection("plan")} icon="checklist" label="План на день" />
                <TabButton active={section === "focus"} onClick={() => { setSection("focus"); setFocusView("dashboard"); }} icon="timer" label="Фокус-блок" />
                <div className="hidden sm:flex gap-2 ml-2">
                  <TopIconButton onClick={() => setSoundEnabled(!soundEnabled)} icon={soundEnabled ? "volume_up" : "volume_off"} />
                  <TopIconButton onClick={() => { setSection("focus"); setFocusView("history"); }} icon="history" />
                </div>
              </div>
            </nav>
          )}

          <main className={`max-w-5xl mx-auto px-4 sm:px-6 safe-bottom ${isFullTimer ? "pt-4" : "pt-6"}`}>
            {section === "plan" ? <DailyPlanView openFocusCreate={openFocusCreate} /> : renderFocusView()}
          </main>
        </div>
      );
    }

    function TopIconButton({ onClick, icon }) {
      return (
        <button onClick={onClick} className="w-10 h-10 rounded-full bg-white/70 border border-stone-100 shadow-sm text-stone-400 hover:text-stone-700 hover:bg-white transition-colors flex items-center justify-center shrink-0">
          <Icon name={icon} size={20} />
        </button>
      );
    }

    function TabButton({ active, onClick, icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`h-11 px-4 rounded-2xl border text-sm font-medium flex items-center gap-2 transition-all whitespace-nowrap shrink-0 ${active ? "bg-teal-600 text-white border-teal-600 shadow-sm hover:bg-teal-700" : "bg-white/70 text-stone-500 border-stone-100 hover:text-stone-800 hover:bg-white"}`}
        >
          <Icon name={icon} size={18} />
          {label}
        </button>
      );
    }

    function DailyPlanView({ openFocusCreate }) {
      const [tasks, setTasks] = useStoredState("dailyPlanTasksV2", getInitialDailyTasks());
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [toast, setToast] = useState("");

      useEffect(() => {
        if (!Array.isArray(tasks) || tasks.length !== 10) setTasks(getInitialDailyTasks());
      }, []);

      const doneCount = tasks.filter(t => t.done).length;

      const showToast = (message) => {
        setToast(message);
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => setToast(""), 1500);
      };

      const updateTask = (index, patch) => {
        const nextTasks = tasks.map((task, i) => i === index ? { ...task, ...patch } : task);
        setTasks(Object.prototype.hasOwnProperty.call(patch, "done") ? sortDoneFirst(nextTasks) : nextTasks);
      };

      const moveDoneTasksUp = () => {
        setTasks(sortDoneFirst(tasks));
        showToast("Готові задачі піднято");
      };

      const resetTasks = () => {
        setTasks(getInitialDailyTasks());
        showToast("План очищено");
      };

      const reorderTasks = (fromIndex, toIndex) => {
        if (fromIndex === null || fromIndex === toIndex) return;
        const next = [...tasks];
        const [moved] = next.splice(fromIndex, 1);
        next.splice(toIndex, 0, moved);
        setTasks(next);
      };

      const copyForTelegram = async () => {
        const text = buildTelegramTextFromTasks(tasks);
        try {
          await navigator.clipboard.writeText(text);
          showToast("Скопійовано");
        } catch {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
          showToast("Скопійовано");
        }
      };

      return (
        <div className="fade-in max-w-4xl mx-auto pt-4 sm:pt-10">
          <header className="mb-6 sm:mb-8">
            <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-teal-50 text-teal-700 text-xs font-medium mb-4">
              <Icon name="checklist" size={15} />
              Сторінка 1
            </div>
            <h1 className="text-3xl sm:text-5xl font-light tracking-tight mb-3">План на день</h1>
            <p className="text-stone-500 max-w-2xl">10 порожніх задач. Вписуйте самі, міняйте порядок, ставте галочки й копіюйте список у Telegram. Цей список окремий і не впливає на таймер.</p>
          </header>

          <div className="grid lg:grid-cols-[1fr_240px] gap-4 sm:gap-5">
            <section className="bg-white rounded-[2rem] p-4 sm:p-6 shadow-sm border border-stone-100">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
                <div>
                  <h2 className="text-lg font-medium text-stone-800">Список задач</h2>
                  <p className="text-sm text-stone-400">Виконано {doneCount} з 10</p>
                </div>
                <div className="h-2 w-full sm:w-40 bg-stone-100 rounded-full overflow-hidden">
                  <div className="h-full bg-teal-500 transition-all" style={{ width: `${doneCount * 10}%` }}></div>
                </div>
              </div>

              <div className="space-y-2.5">
                {tasks.map((task, index) => (
                  <div
                    key={task.id}
                    draggable
                    onDragStart={() => setDraggedIndex(index)}
                    onDragEnd={() => setDraggedIndex(null)}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={(e) => { e.preventDefault(); reorderTasks(draggedIndex, index); }}
                    className={`grid grid-cols-[32px_34px_1fr_36px] sm:grid-cols-[34px_38px_1fr_40px] items-center gap-2 sm:gap-3 p-3 rounded-2xl border transition-all ${draggedIndex === index ? "opacity-50 border-teal-300 bg-teal-50/60 border-dashed" : task.done ? "border-teal-100 bg-teal-50/30" : "border-stone-100 bg-stone-50/70 hover:bg-white hover:border-stone-200"}`}
                  >
                    <div className="cursor-grab active:cursor-grabbing text-stone-300 hover:text-stone-500 flex justify-center">
                      <Icon name="drag_indicator" size={20} />
                    </div>
                    <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-xs font-medium shrink-0 ${task.done ? "bg-teal-100 text-teal-700" : "bg-white text-stone-400 border border-stone-100"}`}>
                      {index + 1}
                    </div>
                    <input
                      type="text"
                      value={task.text}
                      onChange={(e) => updateTask(index, { text: e.target.value })}
                      placeholder="Вписати задачу..."
                      className={`min-w-0 w-full bg-transparent outline-none text-sm sm:text-base ${task.done ? "text-stone-400 line-through decoration-teal-500/60 decoration-2" : "text-stone-800 placeholder:text-stone-300"}`}
                    />
                    <button
                      onClick={() => updateTask(index, { done: !task.done })}
                      className={`w-9 h-9 rounded-xl flex items-center justify-center transition-all ${task.done ? "bg-teal-500 text-white" : "bg-white border border-stone-200 text-stone-300 hover:text-teal-600 hover:border-teal-200"}`}
                      title="Позначити виконаною"
                    >
                      <Icon name={task.done ? "check" : "radio_button_unchecked"} size={task.done ? 19 : 20} />
                    </button>
                  </div>
                ))}
              </div>
            </section>

            <aside className="space-y-3">
              <div className="bg-white rounded-[2rem] p-5 shadow-sm border border-stone-100">
                <div className="text-4xl font-light tracking-tight mb-1">{doneCount}/10</div>
                <div className="text-sm text-stone-500 mb-5">готово сьогодні</div>
                <div className="space-y-2">
                  <button onClick={copyForTelegram} className="w-full py-3 bg-teal-600 text-white rounded-2xl font-medium hover:bg-teal-700 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <Icon name="content_copy" size={18} />
                    Copy for Telegram
                  </button>
                  <button onClick={moveDoneTasksUp} className="w-full py-3 bg-stone-100 text-stone-700 rounded-2xl font-medium hover:bg-stone-200 transition-colors flex items-center justify-center gap-2">
                    <Icon name="vertical_align_top" size={18} />
                    Done tasks up
                  </button>
                  <button onClick={resetTasks} className="w-full py-3 bg-red-50 text-red-500 rounded-2xl font-medium hover:bg-red-100 transition-colors flex items-center justify-center gap-2">
                    <Icon name="restart_alt" size={18} />
                    Reset
                  </button>
                </div>
              </div>

              <div className="bg-teal-600 text-white rounded-[2rem] p-5 shadow-sm">
                <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center mb-4">
                  <Icon name="timer" size={22} />
                </div>
                <h3 className="font-medium mb-1">Готові фокуситись?</h3>
                <p className="text-sm text-stone-300 mb-5">Перейдіть на окрему сторінку таймера. План на день не переноситься автоматично.</p>
                <button onClick={openFocusCreate} className="w-full py-3 bg-white text-teal-700 rounded-2xl font-medium hover:bg-stone-100 transition-colors">
                  Створити фокус-блок
                </button>
              </div>
            </aside>
          </div>

          {toast && (
            <div className="fixed left-1/2 bottom-6 -translate-x-1/2 px-4 py-3 rounded-2xl bg-teal-600 text-white shadow-xl text-sm font-medium z-50">
              {toast} ✅
            </div>
          )}
        </div>
      );
    }

    function DashboardView({ goToCreate, goToHistory, history }) {
      const today = new Date().toDateString();
      const todayBlocks = history.filter(b => new Date(b.date).toDateString() === today);
      const totalMinutesToday = todayBlocks.reduce((acc, curr) => acc + (curr.totalWorkedMinutes || 0), 0);

      return (
        <div className="fade-in pt-4 sm:pt-10">
          <header className="mb-8 sm:mb-12">
            <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-teal-50 text-teal-700 text-xs font-medium mb-4">
              <Icon name="timer" size={15} />
              Сторінка 2
            </div>
            <h1 className="text-3xl sm:text-5xl font-light tracking-tight mb-3">Фокус-блок / Помодоро</h1>
            <p className="text-stone-500">Тут окремі задачі таймера, розподіл часу, старт блоку, історія та перерва.</p>
          </header>

          <div className="grid sm:grid-cols-2 gap-4 mb-10">
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100 flex flex-col justify-between items-start">
              <div className="p-3 bg-teal-50 text-teal-600 rounded-2xl mb-4">
                <Icon name="play_arrow" filled={true} size={24} />
              </div>
              <h3 className="text-lg font-medium mb-1">Новий блок</h3>
              <p className="text-stone-500 text-sm mb-6">Сплануйте задачі саме для таймера та розподіліть час.</p>
              <button onClick={goToCreate} className="w-full py-3 bg-teal-600 text-white rounded-xl font-medium hover:bg-teal-700 transition-all active:scale-[0.98]">
                Створити блок
              </button>
            </div>

            <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
              <div className="flex justify-between items-start mb-6">
                <div className="p-3 bg-stone-50 text-stone-600 rounded-2xl">
                  <Icon name="bar_chart" size={24} />
                </div>
                <span className="text-xs font-medium text-stone-400 uppercase tracking-wider">Сьогодні</span>
              </div>
              <div className="space-y-4">
                <div><div className="text-3xl font-light">{todayBlocks.length}</div><div className="text-sm text-stone-500">завершених блоків</div></div>
                <div className="h-px w-full bg-stone-100"></div>
                <div><div className="text-3xl font-light">{Math.round(totalMinutesToday)}</div><div className="text-sm text-stone-500">хвилин фокусу</div></div>
              </div>
            </div>
          </div>

          {history.length > 0 && (
            <div>
              <div className="flex justify-between items-end mb-4">
                <h3 className="text-lg font-medium text-stone-700">Останні сесії</h3>
                <button onClick={goToHistory} className="text-sm text-teal-600 hover:text-teal-700 font-medium">Всі записи →</button>
              </div>
              <div className="bg-white rounded-3xl p-2 shadow-sm border border-stone-100">
                {history.slice(0, 3).map((block, i) => (
                  <div key={i} className="flex justify-between items-center p-4 hover:bg-stone-50 rounded-2xl transition-colors gap-4">
                    <div className="min-w-0">
                      <div className="font-medium truncate">{block.title}</div>
                      <div className="text-xs text-stone-500">{new Date(block.date).toLocaleDateString("uk-UA")} • {block.completedTasks}/{block.totalTasks} задач</div>
                    </div>
                    <div className="text-stone-400 text-sm whitespace-nowrap">{Math.round(block.totalWorkedMinutes)} хв</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function CreateBlockView({ config, setConfig, goBack, startBlock }) {
      const [newTaskTitle, setNewTaskTitle] = useState("");
      const [draggedIndex, setDraggedIndex] = useState(null);

      const addTask = () => {
        if (!newTaskTitle.trim()) return;
        setConfig({ ...config, tasks: [...config.tasks, { id: uid(), title: newTaskTitle.trim(), priority: "medium", completed: false }] });
        setNewTaskTitle("");
      };

      const removeTask = (id) => setConfig({ ...config, tasks: config.tasks.filter(t => t.id !== id) });

      const handleStart = () => {
        const tasksWithTime = calculateTaskTimes(config.tasks, config.workDuration, config.distributionMode);
        if (tasksWithTime.length === 0) return alert("Додайте хоча б одну задачу.");
        startBlock({ ...config, tasks: tasksWithTime, startTime: Date.now() });
      };

      const handleDragEnter = (index) => {
        if (draggedIndex === null || draggedIndex === index) return;
        const newTasks = [...config.tasks];
        const [draggedItem] = newTasks.splice(draggedIndex, 1);
        newTasks.splice(index, 0, draggedItem);
        setDraggedIndex(index);
        setConfig({ ...config, tasks: newTasks });
      };

      const previewTasks = calculateTaskTimes(config.tasks, config.workDuration, config.distributionMode);

      return (
        <div className="slide-in max-w-2xl mx-auto">
          <button onClick={goBack} className="flex items-center text-sm text-stone-500 hover:text-stone-800 mb-6 sm:mb-8 transition-colors">← Назад</button>

          <div className="bg-white rounded-[2rem] p-5 sm:p-8 shadow-sm border border-stone-100 mb-5 sm:mb-6">
            <input type="text" value={config.title} onChange={(e) => setConfig({ ...config, title: e.target.value })} className="text-2xl sm:text-3xl font-light w-full border-none bg-transparent outline-none placeholder-stone-300 mb-8 focus:ring-0 p-0" placeholder="Назва блоку..." />

            <div className="grid grid-cols-2 gap-3 sm:gap-4 mb-8">
              <div className="bg-stone-50 p-4 rounded-2xl">
                <label className="text-xs text-stone-500 uppercase tracking-wider block mb-1">Фокус (хв)</label>
                <input type="number" value={config.workDuration} onChange={(e) => setConfig({ ...config, workDuration: Math.max(1, parseInt(e.target.value) || 1) })} className="text-2xl font-medium bg-transparent border-none outline-none w-full p-0 text-stone-800" min="1" />
              </div>
              <div className="bg-stone-50 p-4 rounded-2xl">
                <label className="text-xs text-stone-500 uppercase tracking-wider block mb-1">Перерва (хв)</label>
                <input type="number" value={config.breakDuration} onChange={(e) => setConfig({ ...config, breakDuration: Math.max(0, parseInt(e.target.value) || 0) })} className="text-2xl font-medium bg-transparent border-none outline-none w-full p-0 text-stone-800" min="0" />
              </div>
            </div>

            <div className="mb-6">
              <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-3 mb-4">
                <h3 className="text-lg font-medium">Задачі таймера</h3>
                <div className="flex bg-stone-100 rounded-lg p-1 w-fit">
                  <button className={`text-xs px-3 py-1.5 rounded-md transition-colors ${config.distributionMode === "even" ? "bg-white shadow-sm text-stone-800" : "text-stone-500"}`} onClick={() => setConfig({ ...config, distributionMode: "even" })}>Рівномірно</button>
                  <button className={`text-xs px-3 py-1.5 rounded-md transition-colors ${config.distributionMode === "priority" ? "bg-white shadow-sm text-stone-800" : "text-stone-500"}`} onClick={() => setConfig({ ...config, distributionMode: "priority" })}>За пріоритетом</button>
                </div>
              </div>

              <div className="space-y-3 mb-4">
                {previewTasks.map((task, idx) => (
                  <div key={task.id} draggable onDragStart={() => setDraggedIndex(idx)} onDragEnter={() => handleDragEnter(idx)} onDragEnd={() => setDraggedIndex(null)} onDragOver={(e) => e.preventDefault()} className={`group grid grid-cols-[24px_28px_1fr_auto] sm:grid-cols-[24px_30px_1fr_auto_auto_24px] items-center gap-2 bg-white border p-3 rounded-xl transition-all ${draggedIndex === idx ? "opacity-40 border-teal-400 border-dashed bg-teal-50/50" : "border-stone-200 hover:border-teal-200"}`}>
                    <div className="cursor-grab active:cursor-grabbing text-stone-300 hover:text-stone-500 flex items-center justify-center"><Icon name="drag_indicator" size={20} /></div>
                    <div className="w-7 h-7 shrink-0 rounded-full border border-stone-300 flex items-center justify-center text-xs text-stone-400">{idx + 1}</div>
                    <input type="text" value={task.title} onChange={(e) => {
                      const newTasks = [...config.tasks];
                      const realIndex = config.tasks.findIndex(t => t.id === task.id);
                      if (realIndex >= 0) newTasks[realIndex].title = e.target.value;
                      setConfig({ ...config, tasks: newTasks });
                    }} className="min-w-0 border-none outline-none bg-transparent text-sm ml-1" />
                    {config.distributionMode === "priority" && (
                      <select value={task.priority} onChange={(e) => {
                        const newTasks = [...config.tasks];
                        const realIndex = config.tasks.findIndex(t => t.id === task.id);
                        if (realIndex >= 0) newTasks[realIndex].priority = e.target.value;
                        setConfig({ ...config, tasks: newTasks });
                      }} className="text-xs bg-stone-50 border-none outline-none rounded-md px-2 py-1 text-stone-600 cursor-pointer max-w-[110px]">
                        <option value="low">Низький</option><option value="medium">Середній</option><option value="high">Високий</option>
                      </select>
                    )}
                    <div className="text-xs font-medium text-teal-600 bg-teal-50 px-2 py-1 rounded-md min-w-[52px] text-center">{Math.round(task.assignedSeconds / 60)} хв</div>
                    <button onClick={() => removeTask(task.id)} className="hidden sm:flex text-stone-300 hover:text-red-400 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity ml-1"><Icon name="delete" size={16} /></button>
                  </div>
                ))}
              </div>

              <div className="flex items-center gap-3">
                <input type="text" value={newTaskTitle} onChange={(e) => setNewTaskTitle(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTask()} placeholder="Додати нову задачу..." className="min-w-0 flex-grow border border-stone-200 rounded-xl p-3 text-sm outline-none focus:border-teal-400 transition-colors bg-stone-50" />
                <button onClick={addTask} className="p-3 bg-stone-100 text-stone-600 rounded-xl hover:bg-stone-200 transition-colors flex items-center justify-center shrink-0"><Icon name="add" size={20} /></button>
              </div>
            </div>
          </div>

          <button onClick={handleStart} className="w-full flex items-center justify-center gap-2 py-4 bg-teal-600 text-white rounded-[1.5rem] font-medium text-lg hover:bg-teal-700 hover:shadow-lg hover:shadow-teal-600/20 transition-all active:scale-[0.98]">
            Почати блок <Icon name="arrow_forward" size={20} />
          </button>
        </div>
      );
    }

    function ActiveBlockView({ session, updateSession, soundEnabled, finishBlock, abortBlock }) {
      if (!session || !session.tasks || !session.tasks.length) return null;

      const [isRunning, setIsRunning] = useState(true);
      const [currentTaskIndex, setCurrentTaskIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(Math.max(1, Math.floor(session.tasks[0]?.assignedSeconds || 1)));
      const [isDistractionFree, setIsDistractionFree] = useState(false);
      const [actualSecondsWorked, setActualSecondsWorked] = useState(0);
      const finishingRef = useRef(false);

      const currentTask = session.tasks[currentTaskIndex];
      const isLastTask = currentTaskIndex === session.tasks.length - 1;

      const finishCurrentBlock = () => {
        if (finishingRef.current) return;
        finishingRef.current = true;
        setIsRunning(false);
        const completedCount = session.tasks.filter(t => t.completed).length;
        finishBlock({ title: session.title, breakDuration: session.breakDuration, totalTasks: session.tasks.length, completedTasks: completedCount, totalWorkedMinutes: actualSecondsWorked / 60, tasks: session.tasks });
      };

      const goNextTask = () => {
        if (isLastTask) {
          finishCurrentBlock();
          return;
        }
        const nextIndex = currentTaskIndex + 1;
        setCurrentTaskIndex(nextIndex);
        setTimeLeft(Math.max(1, Math.floor(session.tasks[nextIndex].assignedSeconds || 1)));
      };

      useEffect(() => {
        if (!isRunning || finishingRef.current) return;
        const interval = setInterval(() => {
          setTimeLeft(prev => {
            const next = Math.max(0, prev - 1);
            if (prev > 0) setActualSecondsWorked(worked => worked + 1);
            if (next === 0) {
              window.setTimeout(() => {
                if (soundEnabled) playSoftChime();
                goNextTask();
              }, 0);
            }
            return next;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [isRunning, currentTaskIndex, soundEnabled, isLastTask]);

      const toggleTaskCompletion = (taskId) => {
        const updatedTasks = session.tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t);
        updateSession({ ...session, tasks: updatedTasks });
      };

      const totalSessionSeconds = session.tasks.reduce((sum, t) => sum + Math.max(0, Math.floor(t.assignedSeconds || 0)), 0) || 1;
      const completedBefore = session.tasks.slice(0, currentTaskIndex).reduce((sum, t) => sum + Math.max(0, Math.floor(t.assignedSeconds || 0)), 0);
      const currentAssigned = Math.max(1, Math.floor(currentTask.assignedSeconds || 1));
      const elapsedInCurrent = Math.max(0, currentAssigned - timeLeft);
      const progressPercent = Math.min(100, Math.max(0, ((completedBefore + elapsedInCurrent) / totalSessionSeconds) * 100));

      return (
        <div className={`fade-in flex flex-col items-center justify-center min-h-[calc(100vh-2rem)] ${isDistractionFree ? "mt-0" : "mt-4"}`}>
          <button onClick={() => setIsDistractionFree(!isDistractionFree)} className="fixed top-4 right-4 sm:top-6 sm:right-6 text-stone-400 hover:text-stone-600 bg-white/70 p-2 rounded-full backdrop-blur transition-all z-10" title="Режим фокусу"><Icon name={isDistractionFree ? "fullscreen_exit" : "fullscreen"} size={20} /></button>

          {!isDistractionFree && (
            <div className="w-full max-w-md mb-10 sm:mb-12 text-center px-2">
              <div className="text-sm font-medium text-stone-400 uppercase tracking-widest mb-4">{session.title}</div>
              <div className="h-1.5 w-full bg-stone-200 rounded-full overflow-hidden"><div className="h-full bg-teal-500 transition-all duration-1000 ease-linear" style={{ width: `${progressPercent}%` }}></div></div>
            </div>
          )}

          <div className="text-center mb-8 max-w-lg px-4">
            <div className="text-stone-400 text-sm mb-2 flex justify-center items-center gap-2"><span className="w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>Поточна задача ({currentTaskIndex + 1} з {session.tasks.length})</div>
            <h2 className="text-2xl sm:text-3xl font-medium text-stone-800 break-words">{currentTask.title}</h2>
          </div>

          <div className="text-[5.4rem] xs:text-[6rem] sm:text-[8rem] font-light text-teal-700 tracking-tighter leading-none mb-10 sm:mb-12 tabular-nums">{formatTime(timeLeft)}</div>

          <div className="flex items-center gap-6 mb-12 sm:mb-16">
            <button onClick={abortBlock} className="w-12 h-12 flex items-center justify-center rounded-full text-stone-400 hover:text-red-500 hover:bg-red-50 transition-colors"><Icon name="stop" size={20} /></button>
            <button onClick={() => setIsRunning(!isRunning)} className={`w-20 h-20 flex items-center justify-center rounded-full text-white shadow-xl transition-all hover:scale-105 active:scale-95 ${isRunning ? "bg-teal-600 shadow-teal-600/30" : "bg-teal-600 shadow-teal-600/30"}`}><Icon name={isRunning ? "pause" : "play_arrow"} filled={true} size={32} /></button>
            <button onClick={goNextTask} className="w-12 h-12 flex items-center justify-center rounded-full text-stone-400 hover:text-teal-600 hover:bg-teal-50 transition-colors"><Icon name="skip_next" size={20} /></button>
          </div>

          {!isDistractionFree && (
            <div className="w-full max-w-md bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-stone-100">
              <h3 className="text-sm font-medium text-stone-500 mb-4 flex items-center gap-2"><Icon name="list" size={16} /> Чекліст</h3>
              <div className="space-y-3">
                {session.tasks.map((task, idx) => (
                  <div key={task.id} className={`flex items-start gap-3 p-3 rounded-xl transition-all cursor-pointer border ${idx === currentTaskIndex ? "border-teal-200 bg-teal-50/30" : "border-transparent hover:bg-stone-50"}`} onClick={() => toggleTaskCompletion(task.id)}>
                    <div className={`mt-0.5 transition-colors ${task.completed ? "text-teal-500" : "text-stone-300"}`}><Icon name={task.completed ? "check_circle" : "radio_button_unchecked"} size={20} /></div>
                    <div className={`flex-grow text-sm min-w-0 break-words ${task.completed ? "text-stone-400 line-through" : "text-stone-700"} ${idx === currentTaskIndex ? "font-medium" : ""}`}>{task.title}</div>
                    {idx > currentTaskIndex && <div className="text-xs text-stone-400 whitespace-nowrap">{Math.round(task.assignedSeconds / 60)} хв</div>}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function BreakView({ duration, finishBreak, soundEnabled }) {
      const [timeLeft, setTimeLeft] = useState(Math.max(0, Math.floor((Number(duration) || 0) * 60)));
      const finishedRef = useRef(false);

      useEffect(() => {
        if (finishedRef.current) return;
        if (timeLeft <= 0) {
          finishedRef.current = true;
          if (soundEnabled) playSoftChime();
          finishBreak();
          return;
        }
        const timer = setInterval(() => setTimeLeft(prev => Math.max(0, prev - 1)), 1000);
        return () => clearInterval(timer);
      }, [timeLeft, finishBreak, soundEnabled]);

      return (
        <div className="fade-in flex flex-col items-center justify-center min-h-[calc(100vh-2rem)] text-center px-4">
          <div className="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mb-8"><Icon name="schedule" size={32} /></div>
          <h2 className="text-2xl font-light text-stone-500 mb-2">Час відпочити</h2>
          <p className="text-stone-400 text-sm mb-12">Відведіть погляд від екрану, зробіть ковток води.</p>
          <div className="text-7xl font-light text-blue-900 tracking-tighter mb-16 tabular-nums">{formatTime(timeLeft)}</div>
          <button onClick={finishBreak} className="px-6 py-3 bg-white border border-stone-200 text-stone-600 rounded-xl hover:bg-stone-50 transition-colors text-sm font-medium">Пропустити перерву</button>
        </div>
      );
    }

    function SummaryView({ session, startBreak, goHome }) {
      if (!session) return null;
      const isPerfect = session.completedTasks === session.totalTasks;
      return (
        <div className="slide-in max-w-lg mx-auto pt-6 sm:pt-10">
          <div className="bg-white rounded-[2.5rem] p-6 sm:p-10 shadow-sm border border-stone-100 text-center relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-teal-400 to-emerald-400"></div>
            <div className="w-20 h-20 mx-auto bg-stone-50 rounded-full flex items-center justify-center mb-6"><Icon name="check_circle" filled={isPerfect} size={40} className={isPerfect ? "text-teal-500" : "text-stone-400"} /></div>
            <h2 className="text-3xl font-light mb-2">Блок завершено</h2>
            <p className="text-stone-500 mb-8">Ви чудово попрацювали. Ось результати сесії.</p>
            <div className="grid grid-cols-2 gap-4 mb-8 text-left">
              <div className="bg-stone-50 p-4 rounded-2xl"><div className="text-stone-400 text-xs uppercase tracking-wider mb-1">Фокус</div><div className="text-2xl font-medium text-stone-800">{Math.round(session.totalWorkedMinutes)} хв</div></div>
              <div className="bg-stone-50 p-4 rounded-2xl"><div className="text-stone-400 text-xs uppercase tracking-wider mb-1">Задачі</div><div className="text-2xl font-medium text-stone-800">{session.completedTasks} / {session.totalTasks}</div></div>
            </div>
            <div className="text-left mb-8">
              <div className="text-sm font-medium text-stone-600 mb-3 px-2">Що було зроблено:</div>
              <div className="space-y-2 max-h-48 overflow-y-auto pr-2">
                {session.tasks.map(t => (
                  <div key={t.id} className="flex items-center gap-2 text-sm">
                    <div className={t.completed ? "text-teal-500" : "text-stone-300"}><Icon name={t.completed ? "check_circle" : "radio_button_unchecked"} size={16} /></div>
                    <span className={t.completed ? "text-stone-800" : "text-stone-400"}>{t.title}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="flex flex-col gap-3">
              <button onClick={startBreak} className="w-full py-4 bg-teal-600 text-white rounded-2xl font-medium hover:bg-teal-700 transition-colors">Почати перерву ({session.breakDuration} хв)</button>
              <button onClick={goHome} className="w-full py-4 bg-transparent text-stone-500 hover:bg-stone-50 rounded-2xl font-medium transition-colors">На головну</button>
            </div>
          </div>
        </div>
      );
    }

    function HistoryView({ history, goBack }) {
      return (
        <div className="fade-in max-w-2xl mx-auto">
          <div className="flex items-center mb-8 gap-4">
            <button onClick={goBack} className="p-2 bg-white rounded-full shadow-sm hover:bg-stone-50 text-stone-600"><Icon name="chevron_right" size={20} className="rotate-180" /></button>
            <h2 className="text-2xl font-medium text-stone-800">Історія блоків</h2>
          </div>
          {history.length === 0 ? (
            <div className="text-center py-20 bg-white rounded-3xl border border-stone-100 border-dashed">
              <Icon name="history" size={48} className="text-stone-300 mb-4" />
              <p className="text-stone-500">Ви ще не завершили жодного блоку.</p>
            </div>
          ) : (
            <div className="space-y-4">
              {history.map((block, idx) => (
                <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border border-stone-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div className="min-w-0">
                    <h3 className="font-medium text-lg text-stone-800 mb-1 truncate">{block.title}</h3>
                    <div className="text-sm text-stone-400 flex items-center gap-2"><Icon name="schedule" size={14} /> {new Date(block.date).toLocaleString("uk-UA", { day: "numeric", month: "short", hour: "2-digit", minute:"2-digit" })}</div>
                  </div>
                  <div className="flex items-center gap-6">
                    <div className="text-right"><div className="text-xs text-stone-400 uppercase tracking-wider mb-0.5">Фокус</div><div className="font-medium text-stone-700">{Math.round(block.totalWorkedMinutes)} хв</div></div>
                    <div className="w-px h-8 bg-stone-100"></div>
                    <div className="text-right"><div className="text-xs text-stone-400 uppercase tracking-wider mb-0.5">Задачі</div><div className="font-medium text-stone-700"><span className={block.completedTasks === block.totalTasks ? "text-teal-600" : ""}>{block.completedTasks}</span> / {block.totalTasks}</div></div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
